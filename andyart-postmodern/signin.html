<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AndyArt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #F7F2E8;
      --cream: #FFFDF9;
      --gold: #C6A66B;
      --bronze: #A78345;
      --ink: #171614;
      --soft-black: #211D18;
      --stone: #D7CEC1;
      --walnut: #5D4633;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font-body);
      background: var(--ivory);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(198, 166, 107, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(198, 166, 107, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }

    /* Navbar - consistent across all pages */
    .nav-floating {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding: 14px 28px;
      background: rgba(255, 253, 249, 0.8);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(23, 22, 20, 0.08);
      width: auto;
      max-width: 98vw;
    }
    .nav-brand {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-brand span { color: var(--gold); }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-links .nav-link {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--soft-black);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .nav-links .nav-link:hover {
      color: var(--gold);
      background: rgba(198, 166, 107, 0.1);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .nav-search {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--stone);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-search:hover {
      background: rgba(198, 166, 107, 0.1);
      border-color: var(--gold);
    }
    .nav-search svg { width: 16px; height: 16px; }
    .btn-signin {
      background: var(--ink);
      color: var(--cream);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn-signin:hover {
      background: var(--soft-black);
      transform: translateY(-1px);
    }

    /* Sign in page layout */
    .signin-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 32px 60px;
    }
    .signin-container {
      width: 100%;
      max-width: 440px;
    }
    .signin-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .signin-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .signin-subtitle {
      font-size: 0.9375rem;
      color: var(--walnut);
    }
    .signin-subtitle a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }
    .signin-subtitle a:hover { text-decoration: underline; }

    /* Glass card */
    .signin-card {
      background: rgba(255, 253, 249, 0.6);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(23, 22, 20, 0.06);
    }

    /* Form */
    .form-group {
      margin-bottom: 24px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--soft-black);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--stone);
      border-radius: 12px;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      border-color: var(--gold);
      background: white;
      box-shadow: 0 0 0 3px rgba(198, 166, 107, 0.15);
    }
    .form-input::placeholder {
      color: var(--stone);
    }

    /* Checkbox row */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      color: var(--soft-black);
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }
    .forgot-link {
      font-size: 0.875rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 16px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      color: var(--cream);
      background: var(--ink);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      background: var(--soft-black);
      transform: translateY(-2px);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--stone);
    }
    .divider-text {
      font-size: 0.8125rem;
      color: var(--walnut);
    }

    /* Social buttons */
    .social-buttons {
      display: flex;
      gap: 12px;
    }
    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--soft-black);
      background: white;
      border: 1px solid var(--stone);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-social:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .btn-social svg {
      width: 18px;
      height: 18px;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      font-size: 0.875rem;
      color: var(--walnut);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 16px; height: 16px; }

    @media (max-width: 480px) {
      .navbar {
        top: 16px;
        padding: 12px 20px;
        gap: 16px;
      }
      .signin-card { padding: 28px; }
      .social-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
<nav class="nav-floating">
    <a href="index.html" class="nav-brand">Andy<span>Art</span></a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="gallery.html" class="nav-link">Gallery</a></li>
      <li><a href="artists.html" class="nav-link">Artists</a></li>
      <li><a href="events.html" class="nav-link">Events</a></li>
      <li><a href="services.html" class="nav-link">Services</a></li>
      <li><a href="spaces.html" class="nav-link">Spaces</a></li>
      <li><a href="circle.html" class="nav-link">Circle</a></li>
      <li><a href="journal.html" class="nav-link">Journal</a></li>
      <li><a href="viewing-rooms.html" class="nav-link">Viewing Rooms</a></li>
      <li><a href="partners.html" class="nav-link">Partners</a></li>
      <li><a href="consult.html" class="nav-link">Consult</a></li>
    </ul>
    <div class="nav-right">
      <button class="nav-search" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <a href="signin.html" class="btn-signin">Sign In</a>
    </div>
  </nav>

  <!-- SIGN IN PAGE -->
  <div class="signin-page">
    <div class="signin-container">
      <div class="signin-header">
        <h1 class="signin-title">Welcome back</h1>
        <p class="signin-subtitle">Don't have an account? <a href="#">Create one</a></p>
      </div>

      <div class="signin-card">
        <form>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" checked>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit">Sign in</button>
        </form>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">or continue with</span>
          <span class="divider-line"></span>
        </div>

        <div class="social-buttons">
          <button type="button" class="btn-social">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button type="button" class="btn-social">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            GitHub
          </button>
        </div>
      </div>

      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>
    </div>
  </div>
</body>
</html>
